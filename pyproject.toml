[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-security-testbed"
version = "0.3.1"
description = "Rules-only security regression testbed for AI agents and MCP tool boundaries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Lucas Henrique Grifoni" }
]
dependencies = [
  "pydantic>=2.7.0,<3.0.0",
  "pyyaml>=6.0.1",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "hypothesis>=6.100.0",
  "jsonschema>=4.22.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "types-PyYAML>=6.0.12"
]

[project.scripts]
aiasec = "aiasec.cli.app:app"

[tool.hatch.build.targets.wheel]
# The bundled probe YAML lives inside the package, so `packages` already ships it.
# A force-include of the same directory adds every probe twice and fails the build.
packages = ["src/aiasec"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/aiasec"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
branch = true
source = ["aiasec"]

[tool.coverage.report]
# Line and branch coverage was 92% when this floor was set (2026-11-25).
fail_under = 90
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

