[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-security-testbed"
version = "0.3.0"
description = "Rules-only security regression testbed for AI agents and MCP tool boundaries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Lucas Henrique Grifoni" }
]
dependencies = [
  "anyio>=4.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pyyaml>=6.0.1",
  "typer>=0.12.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "jsonschema>=4.22.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[project.scripts]
aiasec = "aiasec.cli.app:app"

[tool.hatch.build.targets.wheel]
# The bundled probe YAML lives inside the package, so `packages` already ships it.
# A force-include of the same directory adds every probe twice and fails the build.
packages = ["src/aiasec"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

