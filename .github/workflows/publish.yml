# Publish
#
# When a GitHub Release is published: build the wheel and sdist, attest their build
# provenance, generate a CycloneDX SBOM of the installed wheel, and attach all of it to
# the release. The container job builds the image from the Dockerfile, pushes it to
# ghcr.io/lucashgrifoni/ai-agent-security-testbed as :<version> and :latest, and pushes
# a build provenance attestation and a CycloneDX SBOM attestation for its digest to the
# registry. GitHub (Releases and GHCR) is the only distribution channel.
#
# Harden-Runner stays in audit here on purpose: these jobs move artifacts between jobs,
# to the release and to the registry, and sign through Sigstore, over rotating endpoints
# that an exact allowlist cannot name. The runner's global blocklist still applies.

name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, attest and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Pin build timestamps to the commit being built
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build wheel and sdist
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation

      - name: Every bundled probe ships in the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile
          expected = sorted(p.relative_to("src").as_posix() for p in pathlib.Path("src/aiasec/probes").rglob("*.yaml"))
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          shipped = sorted(n for n in zipfile.ZipFile(wheel).namelist() if n.startswith("aiasec/probes/") and n.endswith(".yaml"))
          assert expected and shipped == expected, f"wheel probes {shipped} != source probes {expected}"
          PY

      - name: The release tag and every version string agree
        # Nothing is attested or attached when a manual version bump was missed: the
        # release tag, pyproject.toml, aiasec.__version__ and the built metadata must all
        # name one version.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tarfile, tomllib, zipfile
          def version_field(text):
              return re.search(r"^Version: (.+)$", text, re.M).group(1).strip()
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              wheel_version = version_field(archive.read(name).decode("utf-8"))
          with tarfile.open(sdist) as archive:
              member = next(m for m in archive.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
              sdist_version = version_field(archive.extractfile(member).read().decode("utf-8"))
          init = pathlib.Path("src/aiasec/__init__.py").read_text(encoding="utf-8")
          versions = {
              "pyproject.toml": tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"],
              "aiasec.__version__": re.search(r'^__version__ = "([^"]+)"', init, re.M).group(1),
              "wheel metadata": wheel_version,
              "sdist metadata": sdist_version,
          }
          versions["release tag"] = os.environ["RELEASE_TAG"].removeprefix("v")
          assert len(set(versions.values())) == 1, f"versions disagree: {versions}"
          print(f"{wheel_version}: {', '.join(versions)} agree")
          PY

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*

      - name: Generate the CycloneDX SBOM of the installed wheel
        # The environment holds only the wheel and its dependencies: no pip, no build
        # tools, so the SBOM inventories the release and not the runner.
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/release-env"
          python -m pip --python "$RUNNER_TEMP/release-env/bin/python" install dist/*.whl
          mkdir -p release-assets
          python -m cyclonedx_py environment "$RUNNER_TEMP/release-env/bin/python" \
            --pyproject pyproject.toml --mc-type application \
            --output-format JSON --output-file release-assets/aiasec.cdx.json

      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release-assets/aiasec.intoto.jsonl

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  release-assets:
    name: Attach assets to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets/

      - name: Upload to the release
        # No --clobber: a retried run that rebuilt the files fails here instead of
        # replacing assets that users may already have downloaded and verified.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* release-assets/*

  container:
    name: Build, push and attest the container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job in the repository that can write packages.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/lucashgrifoni/ai-agent-security-testbed
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: The release tag names the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG#v}" = "$version" || { echo "tag $RELEASE_TAG != pyproject $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          docker build \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" .
          docker run --rm "$IMAGE:$VERSION" --version

      - name: Generate the CycloneDX SBOM of the image
        # Before the registry login: the scanner never sees a credential.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: aiasec-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # No overwrite: a rerun fails here instead of replacing an image that users
          # may already have pulled and verified.
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists"; exit 1
          fi
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          digest="${digest#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no pushed digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/lucashgrifoni/ai-agent-security-testbed
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lucashgrifoni/ai-agent-security-testbed
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: aiasec-image.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
