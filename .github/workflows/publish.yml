# Publish
#
# When a GitHub Release is published: build the wheel and sdist, attest their build
# provenance, generate a CycloneDX SBOM of the installed wheel, attach all of it to the
# release, and publish to PyPI through trusted publishing (OIDC). No API token is stored.
#
# One-time owner setup before the PyPI job can run:
#   1. On pypi.org, Account settings > Publishing > Add a pending publisher:
#      project ai-agent-security-testbed, owner lucashgrifoni,
#      repository AI-Agent-Security, workflow publish.yml, environment pypi.
#   2. Set the repository variable PYPI_PUBLISH to true.
# Until then the PyPI job is skipped and the release still receives its signed assets.
# TestPyPI works the same way through workflow_dispatch, the testpypi environment and
# the TESTPYPI_PUBLISH variable.
#
# Harden-Runner stays in audit here on purpose: these jobs move artifacts between jobs
# and to the release through rotating GitHub endpoints that an exact allowlist cannot
# name. The runner's global blocklist still applies.

name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, attest and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Pin build timestamps to the commit being built
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build wheel and sdist
        run: |
          python -m pip install "build>=1.2.0" "cyclonedx-bom==7.4.0"
          python -m build

      - name: Every bundled probe ships in the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile
          expected = sorted(p.relative_to("src").as_posix() for p in pathlib.Path("src/aiasec/probes").rglob("*.yaml"))
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          shipped = sorted(n for n in zipfile.ZipFile(wheel).namelist() if n.startswith("aiasec/probes/") and n.endswith(".yaml"))
          assert expected and shipped == expected, f"wheel probes {shipped} != source probes {expected}"
          PY

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*

      - name: Generate the CycloneDX SBOM of the installed wheel
        # The environment holds only the wheel and its dependencies: no pip, no build
        # tools, so the SBOM inventories the release and not the runner.
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/release-env"
          python -m pip --python "$RUNNER_TEMP/release-env/bin/python" install dist/*.whl
          mkdir -p release-assets
          python -m cyclonedx_py environment "$RUNNER_TEMP/release-env/bin/python" \
            --pyproject pyproject.toml --mc-type application \
            --output-format JSON --output-file release-assets/aiasec.cdx.json

      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release-assets/aiasec.intoto.jsonl

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  release-assets:
    name: Attach assets to the GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets/

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* release-assets/* --clobber

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      vars.PYPI_PUBLISH == 'true' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ai-agent-security-testbed
    permissions:
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          skip-existing: true

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: >-
      vars.TESTPYPI_PUBLISH == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ai-agent-security-testbed
    permissions:
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true
