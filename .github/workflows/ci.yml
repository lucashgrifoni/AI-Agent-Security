# CI
#
# Quality pipeline adapted from the GitHub CI/CD template for a Python package:
# lint, test on every supported Python, then build the wheel and use it the way a
# new user would.
#
# The build job exists because the test suite runs from the source tree and once
# missed that the wheel could not be built at all. It builds the wheel, checks that
# every bundled probe is inside it, installs it in a clean virtualenv, and runs the
# README quickstart through the release gate.
#
# Supply-chain hardening:
#   - Actions are pinned to immutable commit SHAs; the trailing comment records the
#     tag. Dependabot (`github-actions`) refreshes the pins through pull requests.
#   - Python tools install from hash-locked files in .github/requirements (compiled
#     with `uv pip compile --generate-hashes`; Dependabot's `uv` ecosystem refreshes
#     them). The user-journey steps install the built wheel the way a user would.
#   - On push, the build job attests SLSA build provenance for dist/*. It is skipped
#     on pull_request, so fork PRs cannot mint attestations.
#
# Harden-Runner egress: audit first, then switch to block with the observed allowlist.
#
# Secrets: none.

name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Official OASIS SARIF 2.1.0 schema; tests/test_sarif_schema.py validates against it.
  SARIF_SCHEMA_URL: "https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        # Hash-locked (.github/requirements/ci.txt); the package itself adds no dependency
        # and builds with the locked hatchling.
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Ruff
        run: python -m ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            docs.oasis-open.org:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        # Hash-locked (.github/requirements/ci.txt); the package itself adds no dependency
        # and builds with the locked hatchling.
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Download the SARIF 2.1.0 schema
        run: curl --fail --silent --show-error --location "$SARIF_SCHEMA_URL" -o "$RUNNER_TEMP/sarif-schema-2.1.0.json"

      - name: Pytest
        env:
          AIASEC_SARIF_SCHEMA: ${{ runner.temp }}/sarif-schema-2.1.0.json
        run: python -m pytest -rs

      - name: Require the SARIF schema test to run, not skip
        env:
          AIASEC_SARIF_SCHEMA: ${{ runner.temp }}/sarif-schema-2.1.0.json
        run: |
          python -m pytest tests/test_sarif_schema.py -q -rs | tee schema-test.log
          grep -Eq "^2 passed" schema-test.log

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    timeout-minutes: 15
    permissions:
      contents: read
      # Only exercised on push (not pull_request), so fork PRs cannot mint attestations.
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit by design: this job moves artifacts or attests a build through rotating
          # GitHub endpoints that an exact allowlist cannot name; the global blocklist applies.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel and sdist
        # Hash-locked build tools; --no-isolation builds with the locked hatchling instead
        # of fetching an unpinned one.
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation

      - name: Every bundled probe ships in the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile
          expected = sorted(p.relative_to("src").as_posix() for p in pathlib.Path("src/aiasec/probes").rglob("*.yaml"))
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          shipped = sorted(n for n in zipfile.ZipFile(wheel).namelist() if n.startswith("aiasec/probes/") and n.endswith(".yaml"))
          assert expected and shipped == expected, f"wheel probes {shipped} != source probes {expected}"
          print(f"{len(shipped)} probes in {wheel.name}")
          PY

      - name: Install the wheel in a clean virtualenv and run the quickstart
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/user"
          "$RUNNER_TEMP/user/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          AIASEC="$RUNNER_TEMP/user/bin/aiasec"
          "$AIASEC" --version
          "$AIASEC" probes list
          "$AIASEC" run --response "I cannot follow that instruction." --output clean.sarif
          "$AIASEC" gate --report clean.sarif --max-critical 0 --max-high 0 --exit-on-fail
          set +e
          "$AIASEC" run --response "COMPROMISED" --output bad.sarif
          test $? -eq 1 || { echo "a compromised response must exit 1"; exit 1; }
          "$AIASEC" gate --report bad.sarif --max-high 0 --exit-on-fail
          test $? -eq 1 || { echo "the gate must fail a compromised report"; exit 1; }

      - name: Drive the example MCP targets with the installed wheel
        shell: bash
        run: |
          AIASEC="$RUNNER_TEMP/user/bin/aiasec"
          "$AIASEC" run --target examples/target-mcp-good/aiasec-target.json --execute --output "$RUNNER_TEMP/good.sarif"
          "$AIASEC" gate --report "$RUNNER_TEMP/good.sarif" --max-critical 0 --max-high 0 --exit-on-fail
          set +e
          "$AIASEC" run --target examples/target-mcp-vulnerable/aiasec-target.json --execute --output "$RUNNER_TEMP/vulnerable.sarif"
          test $? -eq 1 || { echo "the vulnerable target must fail the run"; exit 1; }
          "$AIASEC" gate --report "$RUNNER_TEMP/vulnerable.sarif" --max-critical 0 --max-high 0 --exit-on-fail
          test $? -eq 1 || { echo "the gate must fail the vulnerable target"; exit 1; }

      - name: Drive the example HTTP target with the installed wheel
        shell: bash
        run: |
          AIASEC="$RUNNER_TEMP/user/bin/aiasec"
          python examples/target-http-vulnerable/server.py --port 8765 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 50); do
            (exec 3<>/dev/tcp/127.0.0.1/8765) 2>/dev/null && break
            sleep 0.2
          done
          set +e
          "$AIASEC" run --target examples/target-http-vulnerable/aiasec-target.json --execute --output "$RUNNER_TEMP/http.sarif"
          test $? -eq 1 || { echo "the vulnerable HTTP target must fail the run"; exit 1; }
          python -c 'import json,sys; p=json.load(open(sys.argv[1]))["runs"][0]["properties"]["aiasec"]; assert p["observationMode"]=="http-target" and p["probesFailed"]==p["probesExecuted"], p' "$RUNNER_TEMP/http.sarif"

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Attest build provenance (SLSA)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
