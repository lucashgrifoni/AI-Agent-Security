# Security CI
#
# Adapted from the Security CI/CD template for this repository:
#   - SAST          : Semgrep, CodeQL (python, actions)
#   - SCA           : pip-audit on the resolved runtime dependencies, Dependency Review (PR)
#   - Secrets       : Trivy (working tree), Gitleaks (git history)
#   - Workflow lint : actionlint
#   - SBOM          : CycloneDX from the installed wheel, uploaded as an artifact
#
# Left out on purpose:
#   - Trivy vuln / Trivy SBOM: the project ships no lockfile, so a filesystem scan
#     finds no packages and would report clean while testing nothing. pip-audit and
#     the CycloneDX job audit the dependency set the wheel actually resolves to.
#   - KICS / Trivy misconfig: no IaC, Dockerfile, or Kubernetes manifests here.
#   - Snyk Open Source: dependency SCA is pip-audit (the resolved runtime set) and
#     Dependency Review (pull requests).
#
# Snyk Code runs only when the repository variable SNYK_ENABLED is true and the
# SNYK_TOKEN secret exists. Until then the job is skipped, and it is not a required
# check, so a skip is never mistaken for a pass.
#
# Supply-chain hardening: actions pinned to commit SHAs (tag in the trailing comment),
# refreshed by Dependabot. Harden-Runner starts in audit mode.
#
# GITHUB_TOKEN is supplied automatically. SARIF upload needs `security-events: write`,
# which is free on public repositories.

name: Security CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  merge_group:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TRIVY_SEVERITY: "MEDIUM,HIGH,CRITICAL"
  TRIVY_SKIP_DIRS: ".git,dist,build"

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            semgrep.dev:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.179.0"

      - name: Scan application and workflow code
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/python \
            --config p/github-actions \
            --severity WARNING \
            --sarif --output=semgrep.sarif \
            --error \
            --metrics=off \
            .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-codeql:
    name: SAST - CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  sast-snyk-code:
    name: SAST - Snyk Code
    # GitHub withholds repository secrets from fork and Dependabot pull requests, so
    # those runs skip the job instead of calling Snyk with an empty token.
    if: >-
      vars.SNYK_ENABLED == 'true'
      && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.snyk.io:443
            deeproxy.snyk.io:443
            downloads.snyk.io:443
            github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1306.3

      - name: Run Snyk Code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=medium --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the package and pip-audit
        # Editable install so --skip-editable leaves out the first-party package while
        # the runtime dependencies that pyproject.toml ranges resolve to are audited.
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip install -e .

      - name: Audit runtime dependencies
        run: pip-audit --skip-editable --progress-spinner off

  secrets-trivy:
    name: Secrets - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            check.trivy.dev:443
            get.trivy.dev:443
            github.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan repository files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          format: sarif
          output: trivy-secrets.sarif
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy secrets SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

  secrets-history-gitleaks:
    name: Secrets History - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # On a cache miss the action downloads gitleaks from a GitHub release, which
          # redirects to release-assets.githubusercontent.com.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan git history for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-review:
    name: SCA - Dependency Review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Review new dependencies introduced by the pull request
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # audit by design: this job moves artifacts or attests a build through rotating
          # GitHub endpoints that an exact allowlist cannot name; the global blocklist applies.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate CycloneDX SBOM from the installed wheel
        # The SBOM describes a clean environment holding only the wheel and its
        # dependencies, so the generator's own packages stay out of it.
        run: |
          python -m pip install "build>=1.2.0" "cyclonedx-bom==7.4.0"
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/target"
          "$RUNNER_TEMP/target/bin/python" -m pip install dist/*.whl
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json "$RUNNER_TEMP/target/bin/python"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  workflow-lint:
    name: Workflow Lint - actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # pinned
