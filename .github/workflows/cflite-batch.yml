# ClusterFuzzLite: batch fuzzing
#
# Fuzzes every Atheris harness in fuzz/ for longer than a pull request can wait, under
# AddressSanitizer, and saves the grown corpus as an artifact the pull-request workflow
# (cflite-pr.yml) starts from. A crash fails the run and ClusterFuzzLite uploads the
# reproducer as an artifact; docs/testing.md explains how to triage it.
#
# Supply-chain hardening:
#   - Actions are pinned to commit SHAs (Dependabot refreshes them). The ClusterFuzzLite
#     actions run the gcr.io/oss-fuzz-base/clusterfuzzlite-*:v1 images their action.yml
#     names by tag; a workflow cannot pin them further.
#   - The build image is pinned by digest in .clusterfuzzlite/Dockerfile.
#
# Harden-Runner egress: audit by design, see the job.
#
# Secrets: none. The GITHUB_TOKEN only reads the corpus artifacts of earlier runs.

name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Batch fuzz (address)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Download the corpus saved by earlier runs.
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # audit by design: this job moves artifacts or attests a build through rotating
          # GitHub endpoints that an exact allowlist cannot name; the global blocklist applies.
          egress-policy: audit

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: batch
          sanitizer: address
          fuzz-seconds: 1800
