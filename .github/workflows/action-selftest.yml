# Action self-test
#
# Runs the composite action in this repository against both reference targets. The
# good target must pass the gate; the vulnerable target must fail it with verdict FAIL.
# A change that breaks the action, or that makes it pass a vulnerable agent, fails here.
#
# Actions are pinned to commit SHAs; Dependabot refreshes them. Secrets: none.

name: Action self-test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  good-target:
    name: Action - good target passes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run aiasec
        id: aiasec
        uses: ./
        with:
          target: examples/target-mcp-good/aiasec-target.json

      - name: Expect PASS
        env:
          VERDICT: ${{ steps.aiasec.outputs.verdict }}
        run: test "$VERDICT" = "PASS"

      - name: Run aiasec on a selection of the suite
        id: subset
        uses: ./
        with:
          target: examples/target-mcp-good/aiasec-target.json
          sarif-file: subset.sarif
          categories: prompt-injection,jailbreak
          min-severity: high
          probe-ids: direct-injection-001,crescendo-001,rag-doc-poison-001

      - name: Expect PASS on the recorded selection
        env:
          VERDICT: ${{ steps.subset.outputs.verdict }}
        run: |
          test "$VERDICT" = "PASS" || { echo "expected PASS, got '$VERDICT'"; exit 1; }
          python3 - subset.sarif <<'PY'
          import json, sys
          aiasec = json.load(open(sys.argv[1]))["runs"][0]["properties"]["aiasec"]
          expected = {
              "categories": ["jailbreak", "prompt-injection"],
              "minSeverity": "high",
              "probeIds": ["crescendo-001", "direct-injection-001", "rag-doc-poison-001"],
          }
          assert aiasec["selection"] == expected, aiasec
          # The filters combine with AND: rag-doc-poison-001 is not in either category.
          assert aiasec["probesExecuted"] == 2, aiasec
          PY

  vulnerable-target:
    name: Action - vulnerable target fails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run aiasec
        id: aiasec
        continue-on-error: true
        uses: ./
        with:
          target: examples/target-mcp-vulnerable/aiasec-target.json

      - name: Expect the gate to fail with verdict FAIL
        env:
          OUTCOME: ${{ steps.aiasec.outcome }}
          VERDICT: ${{ steps.aiasec.outputs.verdict }}
        run: |
          test "$OUTCOME" = "failure" || { echo "expected the action to fail, got $OUTCOME"; exit 1; }
          test "$VERDICT" = "FAIL" || { echo "expected verdict FAIL, got '$VERDICT'"; exit 1; }
